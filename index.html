<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de Color RGB</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        .color-box {
            width: 100%;
            height: 150px;
            background-color: #000000;
            border-radius: 10px;
            border: 1px solid #ccc;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .input-group input {
            width: 70px;
            text-align: center;
            border-radius: 5px;
            border: 1px solid #ccc;
            padding: 5px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #333;
        }
        label {
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container text-center mt-5">
        <h1>Selector de Color RGB</h1>
        <div class="color-box mt-3" id="colorBox"></div>
        <p class="mt-2">Código Hex: <span id="hexCode">#000000</span></p>
        
        <div class="mt-3">
            <label for="red">Rojo</label>
            <input type="range" id="red" min="0" max="255" value="0" class="form-range">
            <input type="number" id="redInput" min="0" max="255" value="0" class="form-control">
            
            <label for="green">Verde</label>
            <input type="range" id="green" min="0" max="255" value="0" class="form-range">
            <input type="number" id="greenInput" min="0" max="255" value="0" class="form-control">
            
            <label for="blue">Azul</label>
            <input type="range" id="blue" min="0" max="255" value="0" class="form-range">
            <input type="number" id="blueInput" min="0" max="255" value="0" class="form-control">
        </div>
    </div>
    
    <script>
        const red = document.getElementById("red");
        const green = document.getElementById("green");
        const blue = document.getElementById("blue");
        const redInput = document.getElementById("redInput");
        const greenInput = document.getElementById("greenInput");
        const blueInput = document.getElementById("blueInput");
        const colorBox = document.getElementById("colorBox");
        const hexCode = document.getElementById("hexCode");

        function updateColor() {
            const r = parseInt(red.value);
            const g = parseInt(green.value);
            const b = parseInt(blue.value);
            
            redInput.value = r;
            greenInput.value = g;
            blueInput.value = b;
            
            const hex = `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
            colorBox.style.backgroundColor = hex;
            hexCode.textContent = hex;
        }

        function updateSliders() {
            red.value = redInput.value;
            green.value = greenInput.value;
            blue.value = blueInput.value;
            updateColor();
        }

        red.addEventListener("input", updateColor);
        green.addEventListener("input", updateColor);
        blue.addEventListener("input", updateColor);
        redInput.addEventListener("input", updateSliders);
        greenInput.addEventListener("input", updateSliders);
        blueInput.addEventListener("input", updateSliders);
    </script>
</body>
</html>
